[project]
name = "charge-gpu"
version = "0.1.0"
description = "Carrier distributions of reverse-biased PN junctions for photonic modulators on the GPU (JAX)"
requires-python = ">=3.12,<3.13"
dependencies = ["jax>=0.11", "numpy", "scipy", "thermal-gpu"]

[tool.uv.sources]
thermal-gpu = { path = "../thermal_gpu", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charge_gpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
