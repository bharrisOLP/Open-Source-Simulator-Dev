[project]
name = "optics-gpu"
version = "0.1.0"
description = "Ray and physical optics on the GPU for photonics (Optiland + own propagation; PyTorch on ROCm first)"
requires-python = ">=3.12,<3.13"
dependencies = ["optiland==0.6.3", "numpy", "scipy", "torch"]   # the tests use 0.6.3 APIs

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optics_gpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
