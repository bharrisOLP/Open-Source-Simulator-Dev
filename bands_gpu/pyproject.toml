[project]
name = "bands-gpu"
version = "0.1.0"
description = "Plane-wave photonic band solver on the GPU (JAX; AMD ROCm first), in the method of MPB"
requires-python = ">=3.12,<3.13"
dependencies = ["jax>=0.11", "numpy", "scipy"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bands_gpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer checks (a full band path)"]
