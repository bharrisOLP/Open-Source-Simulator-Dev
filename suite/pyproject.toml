[project]
name = "photonsuite"
version = "0.1.0"
description = "One device description for the GPU solvers of this repository: modes, heat, carriers (multiphysics)"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "scipy", "shapely>=2", "jax>=0.11", "meow-gpu", "thermal-gpu", "charge-gpu"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
meow-gpu = { path = "../meow_gpu", editable = true }
thermal-gpu = { path = "../thermal_gpu", editable = true }
charge-gpu = { path = "../charge_gpu", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photonsuite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer multiphysics runs"]
