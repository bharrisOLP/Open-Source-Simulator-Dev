[project]
name = "fdtd-gpu"
version = "0.1.0"
description = "A small FDTD front end on fdtdx (JAX; AMD ROCm GPUs first) in the script style of the MIT FDTD package"
requires-python = ">=3.12,<3.13"
dependencies = ["fdtdx==0.6.3", "jax>=0.11", "numpy", "scipy"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdtd_gpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["gpu: runs fdtdx (use the GPU computer)", "slow: longer validation runs"]
