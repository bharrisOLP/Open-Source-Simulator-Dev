[project]
name = "meow-gpu"
version = "0.1.0"
description = "GPU finite-difference mode solver and batched EME kernels for meow (JAX; AMD ROCm first)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "meow-sim==0.15.0",
  "jax>=0.11",
  "numpy",
  "scipy",
]

[dependency-groups]
dev = ["pytest>=8", "tidy3d"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meow_gpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
