[project]
name = "thermal-gpu"
version = "0.1.0"
description = "Heat conduction for photonic heaters on the GPU (finite volumes, JAX; AMD ROCm first)"
requires-python = ">=3.12,<3.13"
dependencies = ["jax>=0.11", "numpy", "scipy"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermal_gpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
